name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand: gh workflow run ci.yml --ref <branch>. Such a run does not count for a pull
  # request's required checks, which only take push and pull_request runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (the comment is the release). No lock file is
# committed: each job resolves the versions composer.json allows for its PHP and Guzzle.
jobs:
  verify:
    name: Lint, analyse and test (PHP 8.5, Guzzle 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer update --no-interaction --no-progress
          composer show guzzlehttp/guzzle | grep -E '^(name|versions)'

      - name: Check the generated API types match the committed OpenAPI document
        run: composer openapi:check

      - name: Check the README examples match the READMEs
        run: composer readme:check

      - name: Check the code style
        run: vendor/bin/php-cs-fixer check --diff --show-progress=none

      # The library, the tests, the scripts and, through ConsumerTypesTest, the consumer files
      # and the README examples with a consumer's configuration.
      - name: Analyse (PHPStan, level max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Test with coverage
        run: php -d pcov.directory=. vendor/bin/phpunit --coverage-text --coverage-clover build/coverage.xml

      - name: Require 95 % of lines covered
        run: |
          php -r '
            $metrics = simplexml_load_file("build/coverage.xml")->project->metrics;
            $covered = 100 * (int) $metrics["coveredstatements"] / max(1, (int) $metrics["statements"]);
            printf("Lines covered: %.2f %%\n", $covered);
            exit($covered < 95 ? 1 : 0);
          '

  php:
    name: PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        guzzle: ['7', '8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies with Guzzle ${{ matrix.guzzle }}
        env:
          GUZZLE: ${{ matrix.guzzle == '7' && '^7.15.2' || '^8.0.1' }}
        run: |
          composer require --no-update --no-interaction "guzzlehttp/guzzle:${GUZZLE}"
          composer update --no-interaction --no-progress
          composer show guzzlehttp/guzzle | grep -E '^(name|versions)'
      # With Guzzle 7, PHPStan checks the library alone: the test helpers use Guzzle 8's
      # generics, and ConsumerTypesTest skips itself (see CONTRIBUTING.md).
      - name: Analyse the library with Guzzle 7
        if: matrix.guzzle == '7'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G src scripts
      - run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies (PHP 8.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      # The oldest versions composer.json allows: Guzzle 7.15.2, with psr7 2.13 and promises
      # 2.5.1. Composer 2.9 and later skip versions with security advisories, here as for a user,
      # so a new advisory would quietly move this job to newer ones: the log shows what was tested.
      - name: Install the lowest dependencies
        run: |
          composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          composer show | grep -E '^(guzzlehttp/(guzzle|psr7|promises)|phpunit/phpunit) '
      - run: vendor/bin/phpunit

  package:
    name: Archive and install (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # What Composer installs from a tag: GitHub's archive of it, which git archive writes from
      # the same .gitattributes.
      - name: Check the archive
        run: |
          mkdir -p build
          git archive --format=tar --prefix=flashpi-php/ -o build/package.tar HEAD
          php scripts/package_check.php build/package.tar

      - name: Install the archive in a clean project and use it, with Guzzle 7 and 8
        run: |
          tar -xf build/package.tar -C "$RUNNER_TEMP"
          for guzzle in '^7.15.2' '^8.0.1'; do
            app="${RUNNER_TEMP}/app-${guzzle//[^0-9]/}"
            mkdir -p "$app"
            (
              cd "$app"
              composer init --no-interaction --quiet --name=check/app
              composer config repositories.flashpi \
                "{\"type\": \"path\", \"url\": \"${RUNNER_TEMP}/flashpi-php\", \"options\": {\"symlink\": false}}"
              composer require --no-interaction --no-progress 'flashpi/flashpi-php:@dev' "guzzlehttp/guzzle:${guzzle}"
            )
            php scripts/installed_check.php "$app"
          done
