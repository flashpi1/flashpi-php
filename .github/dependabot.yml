version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # PHPUnit 12 needs PHP 8.3; the SDK supports 8.2.
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']
      # The Guzzle constraint (^7.15.2 || ^8.0.1) is the Flashpi owner's decision.
      - dependency-name: guzzlehttp/guzzle
        update-types: ['version-update:semver-major']
